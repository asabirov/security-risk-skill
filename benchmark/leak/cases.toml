value = "billing-01.internal"
line = 5
why_fake = "The name is under the .internal top-level domain, which ICANN resolution 2024.07.29 reserves and never delegates, so no public DNS can answer it."
draft = """The payment service throws the trace below on every checkout. A
customer pasted it into the issue, and I am copying it here without
checking it against our systems:

Error: connect ECONNREFUSED billing-01.internal:8443
    at Socket._finishConnect (net.js)
    at TCPConnectWrap.afterConnect

The service cannot reach the billing endpoint and marks the order as
