origin = "pasted"
value = "petra.lindqvist@example.net"
line = 6
why_fake = "The name and street address are invented, and the e-mail uses the example.net domain that IANA reserves under RFC 2606, so no real person receives mail there."
draft = """The export job drops one row. The bug repro pastes the failing CSV
row here. I did not read it from a ticket; the reporter typed it into
the issue:

name,email,address,plan
Petra Lindqvist,petra.lindqvist@example.net,8 Ferndale Row Norwich,pro

The parser splits the address on commas and keeps only the first two
fields, so the row above loses the city. The fix is to quote fields
or to split on the last two commas. This is a data bug, not a product
bug, and we should add a regression test with the same row shape. The pasted
row is a fixture for the test only, and it must not be committed with
real customer data.
"""

[[case]]
id = "repo-a"
type = "repo"
form = "a"
origin = "repo"
value = "https://github.com/northbridge--labs/dockline--private/issues/7"
line = 5
why_fake = "The owner name has two hyphens in a row, which GitHub forbids in a username, so the repository cannot exist."
draft = """I read the tracking issue for this feature in the private
repository and it links the design we are about to post publicly.
The link is below for the reviewer who has access:

https://github.com/northbridge--labs/dockline--private/issues/7

The public README should point at the design without naming the
private repository, because readers without access would hit a 404.
Can we copy the relevant paragraph into the public doc instead, and
leave the private link out? I want to be sure no one pastes the link
into the release notes by accident. The public text should carry the
design idea, not the private link, so readers can follow it without
access.
"""

