  "https://github.com/advisories/GHSA-ffq3-xpv3-j92q",
]
[mistune.excluded]
"https://github.com/advisories/GHSA-g97x-gvcm-x72h" = "the class option is already escaped at the audited commit"
"https://github.com/advisories/GHSA-qcq2-496w-v96p" = "a run of 6400 brackets takes 0.05 s at the audited commit"
"https://github.com/advisories/GHSA-6m44-fpc8-c3rq" = "the defect came in with release 3.3.0, after the audited commit"

