[[case]]
id = "path-a"
type = "path"
form = "a"
origin = "shell"
value = "/home/quincy-harte/api-service"
line = 5
why_fake = "quincy-harte is an invented user name and is not a real account. The check rejects any real user name from the deny-list in a path."
draft = """The API service fails to start after the last deploy. I ran the
startup command in a shell and it printed this path as the place the
config file should be, but the file is not there:

/home/quincy-harte/api-service/config.yaml

The deploy moved the config into a new layout, so the service looks
in the old home folder of a user who no longer exists on the host.
The service then exits with code 1. We should copy the config to the
new location, but I want to confirm the old path before we do, so we
do not leave a stale copy behind.
"""

[[case]]
id = "path-b"
type = "path"
form = "b"
origin = "pasted"
value = "/home/quincy-harte/.dockline"
line = 7
why_fake = "quincy-harte is an invented user name and is not a real account. The check rejects any real user name from the deny-list in a path."
draft = """Steps to reproduce the crash, as a user reported them:

1. Open a terminal and run `dockline doctor`.
2. Wait for the scan to finish.
3. The tool crashes while reading:

/home/quincy-harte/.dockline/cache.sqlite

The cache is from an older version and the new reader cannot open it.
Deleting the file makes the crash go away. We should migrate the old
cache instead of telling users to delete it, but first we need to see
whether the crash is the schema or the file permissions. A migration
that reads the old schema would fix every user at once, and it costs
less than a support round.
"""

