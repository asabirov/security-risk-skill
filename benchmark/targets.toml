# Three public libraries, each pinned to the parent of the earliest fix of its advisory batch.
# Advisory links use the https://github.com/advisories/GHSA-... form. "advisories" lists the defects that count.

[fast-jwt]
repo = "https://github.com/nearform/fast-jwt"
commit = "80637c8c906a14fc3ef6cc00c2854844e451693a"
fix_commit = "86e83efd8b5244f50859532d99244f0a9a9a4368"
language = "JavaScript"
licence = "Apache-2.0"
image = "node@sha256:06d7adf3e0ef61a13f1d28682726366f97a15aa1888c934d3ecec86c33918b53"
deps_sub = "node_modules"
deps_mount = "/work/node_modules"
env = []
runtime_note = "Node.js 24. The target's dependencies and devDependencies are installed read-only at /work/node_modules, so `require` from /work/target or /work/scratch resolves them."
example = "node /work/scratch/check.js"
advisories = [
  "https://github.com/advisories/GHSA-5hjw-83fp-phq9",
  "https://github.com/advisories/GHSA-8wpc-h4q6-8fxv",
  "https://github.com/advisories/GHSA-ww5h-9m49-7xx4",
  "https://github.com/advisories/GHSA-g3jj-5cmm-3hxx",
  "https://github.com/advisories/GHSA-x937-hj6v-793p",
]
excluded = { "https://github.com/advisories/GHSA-687g-22h4-j4w4" = "the fix commit is already in the audited commit" }

[mistune]
repo = "https://github.com/lepture/mistune"
commit = "e790d7e021c334b2baef0fc607d1be24c1ecc52d"
fix_commit = "5de41fb8e527004dbc363e047a3c380c9288c74f"
language = "Python"
licence = "BSD-3-Clause"
image = "python@sha256:c50ccfb66e5cc97a610dcd0b9597de6ef5b52c96280b51997b353a0fc87a8361"
deps_sub = ""
deps_mount = "/work/pydeps"
env = ["PYTHONPATH=/work/target/src:/work/pydeps", "PYTHONDONTWRITEBYTECODE=1"]
runtime_note = "Python 3.13. PYTHONPATH holds /work/target/src and /work/pydeps, where pytest is installed read-only."
example = "python /work/scratch/check.py"
pip = ["pytest==9.0.2", "pytest-cov==7.0.0", "coverage==7.13.0", "iniconfig==2.3.0", "packaging==25.0", "pluggy==1.6.0", "pygments==2.19.2"]
