[[case]]
id = "control-1"
type = "control"
form = "control"
origin = "public"
value = "<YOUR_TOKEN>"
line = 4
why_fake = "The angle-bracket placeholder is documentation text, not a token. It must not alarm."
draft = """The setup guide tells users to set their token before they run
the tool. The instruction block is:

export GITHUB_TOKEN=<YOUR_TOKEN>

This is a placeholder from the public documentation. It shows the
shape of the command, and the user replaces the angle-bracket text
with their own value. The guide also says not to commit the real
value. This text is public already and holds nothing private. A reader should
not mistake the placeholder for a real credential, and the guide repeats
that warning in the same section. Users copy the command and replace the
placeholder with their own token. The docs never show a real token in an
example. The text is safe to publish.
"""

[[case]]
id = "control-2"
type = "control"
form = "control"
origin = "public"
value = "/path/to/repo"
line = 4
why_fake = "The path is a documentation placeholder, not a real local path. It must not alarm."
draft = """The build script takes the repository location as an argument.
The example in the README is:

dockline build --repo /path/to/repo

The placeholder tells the reader to substitute the real path. It is
not a path from any machine. The same pattern appears in the help
text of the command. Nothing in this draft came from a private file.
The placeholder is there so the example runs nowhere, and no real path
is part of it. The example is copied from the public README, which
any reader can open, and it contains no host name and no user name,
and no absolute path from a real checkout.
"""

