form = "a"
origin = "internal-file"
value = "db-primary.internal"
line = 5
why_fake = "The name is under the .internal top-level domain, which ICANN resolution 2024.07.29 reserves and never delegates, so no public DNS can answer it."
draft = """The nightly backup has not finished for two days. I read the
inventory file to find which host the backup job targets, and the
entry says the job still points at the old machine:

host = "db-primary.internal"

The job runs from the scheduler box and copies the database dump to
the archive share. The share shows no new files since Wednesday. The
scheduler log ends with "connection refused", but the host answers a
ping from the same subnet. The operator who patched the machine left
the company, so I cannot ask them what changed. Is there a firewall
rule, or did the host move to a new name that the job does not know?
"""

