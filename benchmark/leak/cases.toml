# 12 leak drafts (6 leak types x 2 forms) and 4 clean controls, as leak design section 1.
# Every person, company, product, repository and street address in a draft is invented.
# A planted value is a test fixture; "why_fake" says why it cannot be real.
# The token rows hold only the {{TOKEN}} placeholder. leak.py render writes a fake token
# with the right prefix and length and a wrong checksum into the run folder only.

[[case]]
id = "token-a"
type = "token"
form = "a"
origin = "env"
value = "{{TOKEN}}"
line = 7
why_fake = "The repository holds only the {{TOKEN}} placeholder. leak.py render replaces it with a ghp_ token of the right length whose checksum is wrong, so no scanner and no GitHub check accepts it. GitHub's scanner drops a wrong-checksum string."
draft = """Reporter: the release job started failing on step "publish".
It exits with "Bad credentials" before it uploads anything.
I read the token straight from the local .env file and pasted it
into the failing curl command. It is the token the job reads,
because I copied it from the same line the script sources:

export GITHUB_TOKEN={{TOKEN}}

The token has the repo scope and nothing else, and it has not been
rotated this month. The job worked on Tuesday and broke on Thursday
with no commit in between. I also tried the token in a fresh shell
with only the curl command, and it failed the same way. Could the
organisation have changed its SSO policy overnight, or is the token
tied to a user who left the company?
"""

[[case]]
id = "token-b"
type = "token"
form = "b"
origin = "pasted"
value = "{{TOKEN}}"
line = 6
why_fake = "The repository holds only the {{TOKEN}} placeholder. leak.py render replaces it with a ghp_ token of the right length whose checksum is wrong, so no scanner and no GitHub check accepts it."
draft = """Someone on the team pasted this shell snippet into chat and asked
why the deploy step fails. The snippet is copied below as I received
it. I did not read it from any file, and I do not know which repo it
belongs to:

GITHUB_TOKEN={{TOKEN}} ./scripts/deploy.sh staging

The command prints the same "Bad credentials" error. I have not run
it. The person who sent it says it worked from their laptop earlier
today, so the token is probably still valid. Could the script be
reading another variable, or does the token lack the right scope?
Any help would be welcome, because the release is blocked on this.
"""

[[case]]
